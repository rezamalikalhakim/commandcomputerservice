<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tentang Kami - Command Computer Service</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
      body { background-color: #0a0a1a; color: #e5e7eb; font-family: 'Plus Jakarta Sans', sans-serif; }
      .gradient-text { background: linear-gradient(135deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .mono { font-family: 'Space Mono', monospace; }
  </style>
</head>
<body class="h-full">

 <header class="sticky top-0 z-30 bg-[#0a0a1a]/90 backdrop-blur-md border-b border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
     <div class="flex items-center gap-2">
      <button onclick="toggleMenu()" class="p-2 rounded-lg hover:bg-gray-800 transition-colors"><i data-lucide="menu" style="width:22px;height:22px;"></i></button>
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white text-sm"><img src="img/Logo.png" width="100%" height="100%"></div>
      <div>
       <a href="index.html"><h1 class="text-lg font-bold gradient-text">Command Computer Service</h1></a>
       <p class="text-[10px] text-gray-500 mono">by Reza Malik Al Hakim</p>
      </div>
     </div>
     
     <div class="hidden md:flex items-center gap-6 text-sm">
        <a href="index.html" class="text-white">Home</a>
        <a href="artikel.html" class="text-gray-400 hover:text-white transition-colors">Artikel</a>
        <a href="service.html" class="text-gray-400 hover:text-white transition-colors">Service</a>
        <a href="kontak.html" class="text-gray-400 hover:text-white transition-colors">Kontak</a>
     </div>
     <a href="kontak.html" class="hidden sm:block px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-black text-sm font-semibold rounded-lg transition-colors">Daftar Service</a>
    </div>
  </header>

  <section class="max-w-7xl mx-auto px-4 py-16">
     <h2 class="text-3xl font-bold mb-2 gradient-text">Galeri Pekerjaan</h2>
     <p class="text-gray-400 mb-8">Dokumentasi perbaikan di Gg.Musik Desa Lebak Anyar.</p>
     <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="aspect-square bg-[#12122a] rounded-xl flex flex-col items-center justify-center border border-gray-800/50">
       <i data-lucide="cpu" class="w-10 h-10 text-cyan-400 mb-2"></i><p class="text-xs text-gray-400 mt-3">Diagnosa Motherboard</p>
      </div>
      <div class="aspect-square bg-[#12122a] rounded-xl flex flex-col items-center justify-center border border-gray-800/50">
       <i data-lucide="hard-drive" class="w-10 h-10 text-purple-400 mb-2"></i><p class="text-xs text-gray-400 mt-3">Recovery HDD</p>
      </div>
      <div class="aspect-square bg-[#12122a] rounded-xl flex flex-col items-center justify-center border border-gray-800/50">
       <i data-lucide="network" class="w-10 h-10 text-green-400 mb-2"></i><p class="text-xs text-gray-400 mt-3">Setup Jaringan</p>
      </div>
     </div>
  </section>

 <script>
        // Fungsi Buka/Tutup Slide Menu
        function toggleMenu(forceClose) {
            const menu = document.getElementById('slideMenu');
            const overlay = document.getElementById('overlay');
            if (forceClose === false || menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                menu.classList.add('open');
                overlay.classList.add('open');
            }
        }

        // Inisialisasi Icon
        lucide.createIcons();
  </script>
</body>
<footer class="bg-[#060612] border-t border-gray-800/50 py-6 text-center text-align-center">
      <p class="text-xs text-gray-600"><strong>© 2021 Command Computer Service</strong> | By. Reza Malik Al Hakim</p>
  </footer>
</html>
