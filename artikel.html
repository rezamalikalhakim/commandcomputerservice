<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel & Tutorial - Command Computer Service</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
      body { background-color: #0a0a1a; color: #e5e7eb; font-family: 'Plus Jakarta Sans', sans-serif; }
      .gradient-text { background: linear-gradient(135deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body class="h-full">

  <header class="sticky top-0 z-30 bg-[#0a0a1a]/90 backdrop-blur-md border-b border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
     <div class="flex items-center gap-2">
      <button onclick="toggleMenu()" class="p-2 rounded-lg hover:bg-gray-800 transition-colors"><i data-lucide="menu" style="width:22px;height:22px;"></i></button>
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white text-sm"><img src="Logo.png" width="100%" height="100%"></div>
      <div>
       <a href="index.html"><h1 class="text-lg font-bold gradient-text">Command Computer Service</h1></a>
       <p class="text-[10px] text-gray-500 mono">by Reza Malik Al Hakim</p>
      </div>
     </div>
     
     <div class="hidden md:flex items-center gap-6 text-sm">
        <a href="index.html" class="text-white">Home</a>
        <a href="artikel.html" class="text-gray-400 hover:text-white transition-colors">Artikel</a>
        <a href="service.html" class="text-gray-400 hover:text-white transition-colors">Service</a>
        <a href="kontak.html" class="text-gray-400 hover:text-white transition-colors">Kontak</a>
     </div>
     <a href="kontak.html" class="hidden sm:block px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-black text-sm font-semibold rounded-lg transition-colors">Daftar Service</a>
    </div>
  </header>

  <section class="max-w-7xl mx-auto px-4 py-16">
    <h2 class="text-3xl font-bold mb-2 gradient-text">Artikel & Tutorial</h2>
    <p class="text-gray-400 mb-8">Panduan troubleshooting komputer lengkap dan terpercaya</p>
    
    <div id="allArticlesContainer" class="grid lg:grid-cols-2 gap-8">
      <p class="text-gray-500 text-sm">Memuat daftar artikel...</p>
    </div>
  </section>
  <script>
        // Fungsi Buka/Tutup Slide Menu
        function toggleMenu(forceClose) {
            const menu = document.getElementById('slideMenu');
            const overlay = document.getElementById('overlay');
            if (forceClose === false || menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.classList.remove('open');
            } else {
                menu.classList.add('open');
                overlay.classList.add('open');
            }
        }

        // Inisialisasi Icon
        lucide.createIcons();
  </script>

<script>
        async function loadAllArticles() {
            const container = document.getElementById('allArticlesContainer');
            const firebaseUrl = 'https://command-computer-service-blog-default-rtdb.asia-southeast1.firebasedatabase.app/artikel.json';

            try {
                const response = await fetch(firebaseUrl);
                const data = await response.json();

                if (data) {
                    container.innerHTML = ''; 
                    
                    const articles = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    })).sort((a, b) => new Date(b.waktu) - new Date(a.waktu));

                    articles.forEach(article => {
                        let catColor = 'text-cyan-400 bg-cyan-400/10';
                        if (article.category === 'Software') catColor = 'text-purple-400 bg-purple-400/10';
                        if (article.category === 'Jaringan') catColor = 'text-amber-400 bg-amber-400/10';

                        const shortDesc = article.content.length > 150 ? article.content.substring(0, 150) + '...' : article.content;

                        const articleHTML = `
                        <article class="bg-[#12122a] rounded-xl p-6 border border-gray-800/50 transition hover:border-cyan-500/50">
                            ${article.image ? `<img src="${article.image}" class="w-full h-48 object-cover rounded-lg mb-4" alt="${article.title}">` : ''}
                            <span class="text-[10px] px-2 py-1 rounded ${catColor}">${article.category.toUpperCase()}</span>
                            <h3 class="text-xl font-bold mt-3 mb-3">
                                <a href="artikel.html?id=${article.id}" class="hover:text-cyan-400">${article.title}</a>
                            </h3>
                            <p class="text-gray-400 text-sm mb-4">${shortDesc}</p>
                            <a href="artikel.html?id=${article.id}" class="text-sm text-cyan-500 hover:underline">Baca selengkapnya &rarr;</a>
                        </article>`;
                        container.innerHTML += articleHTML;
                    });
                } else {
                    container.innerHTML = '<p class="text-gray-500 text-sm col-span-2">Belum ada artikel yang dipublish.</p>';
                }
            } catch (error) {
                console.error('Error memuat artikel:', error);
                container.innerHTML = '<p class="text-red-500 text-sm">Gagal memuat artikel.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadAllArticles);
        lucide.createIcons();
  </script>
</body>
<footer class="bg-[#060612] border-t border-gray-800/50 py-6 text-center text-align-center">
      <p class="text-xs text-gray-600"><strong>© 2021 Command Computer Service</strong> | By. Reza Malik Al Hakim</p>
  </footer>
</html>
