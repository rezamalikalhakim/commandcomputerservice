<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Artikel - Command Computer Service</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
      body { background-color: #0a0a1a; color: #e5e7eb; font-family: 'Plus Jakarta Sans', sans-serif; }
      .gradient-text { background: linear-gradient(135deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .input-field { width: 100%; padding: 12px; background: #12122a; border: 1px solid #1f2937; border-radius: 8px; color: white; margin-top: 8px; }
      .input-field:focus { outline: none; border-color: #00d2ff; }
  </style>
</head>
<body class="h-full">

  <header class="sticky top-0 z-30 bg-[#0a0a1a]/90 backdrop-blur-md border-b border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
     <div class="flex items-center gap-2">
      <button onclick="toggleMenu()" class="p-2 rounded-lg hover:bg-gray-800 transition-colors"><i data-lucide="menu" style="width:22px;height:22px;"></i></button>
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white text-sm"><img src="img/Logo.png" width="100%" height="100%"></div>
      <div>
       <a href="index.html"><h1 class="text-lg font-bold gradient-text">Command Computer Service</h1></a>
       <p class="text-[10px] text-gray-500 mono">by Reza Malik Al Hakim</p>
      </div>
     </div>
     
     <div class="hidden md:flex items-center gap-6 text-sm">
        <a href="index.html" class="text-white">Home</a>
        <a href="artikel.html" class="text-gray-400 hover:text-white transition-colors">Artikel</a>
        <a href="service.html" class="text-gray-400 hover:text-white transition-colors">Service</a>
        <a href="kontak.html" class="text-gray-400 hover:text-white transition-colors">Kontak</a>
     </div>
     <a href="kontak.html" class="hidden sm:block px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-black text-sm font-semibold rounded-lg transition-colors">Daftar Service</a>
    </div>
  </header>

  <section class="max-w-3xl mx-auto px-4 py-12">
    <div class="bg-[#12122a] p-8 rounded-xl border border-gray-800/50">
        <h2 class="text-2xl font-bold mb-6 text-white">Upload Artikel Baru</h2>
        
        <form id="uploadForm" class="space-y-6">
            <div>
                <label class="text-sm text-gray-400">Judul Artikel</label>
                <input type="text" id="postTitle" class="input-field" placeholder="Contoh: Cara Memperbaiki RAM Error..." required>
            </div>

            <div>
                <label class="text-sm text-gray-400">Kategori</label>
                <select id="postCategory" class="input-field">
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Jaringan">Jaringan</option>
                </select>
            </div>

            <div>
                <label class="text-sm text-gray-400">Gambar Thumbnail</label>
                <input type="file" id="postImage" accept="image/*" class="input-field file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-cyan-500 file:text-black hover:file:bg-cyan-400">
            </div>

            <div>
                <label class="text-sm text-gray-400">Isi Artikel (Mendukung tag HTML dasar)</label>
                <textarea id="postContent" rows="10" class="input-field" placeholder="Tulis konten artikel SEO-friendly Anda di sini (1000+ kata)..." required></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-lg hover:opacity-90 transition-opacity">
                Publish Artikel
            </button>
            <p id="uploadStatus" class="text-sm mt-2 hidden text-center"></p>
        </form>
    </div>
  </section>

  <script>
      lucide.createIcons();

      document.getElementById('uploadForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const btn = document.getElementById('btnSubmit');
          const status = document.getElementById('uploadStatus');
          btn.textContent = 'Mempublish...';
          btn.disabled = true;
          
          const title = document.getElementById('postTitle').value;
          const category = document.getElementById('postCategory').value;
          const content = document.getElementById('postContent').value;
          const imageFile = document.getElementById('postImage').files[0];

          // Fungsi mengubah gambar ke Base64 agar bisa disimpan di Realtime Database
          const toBase64 = file => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = () => resolve(reader.result);
              reader.onerror = error => reject(error);
          });

          let imageBase64 = '';
          if (imageFile) {
              imageBase64 = await toBase64(imageFile);
          }

          const dataArtikel = {
              title: title,
              category: category,
              content: content,
              image: imageBase64,
              waktu: new Date().toISOString()
          };

          const firebaseUrl = 'https://command-computer-service-blog-default-rtdb.asia-southeast1.firebasedatabase.app/artikel.json';

          try {
              const response = await fetch(firebaseUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(dataArtikel)
              });

              if(response.ok) {
                  status.textContent = '✅ Artikel berhasil dipublish!';
                  status.className = 'text-sm mt-2 text-green-400 block text-center';
                  document.getElementById('uploadForm').reset();
              } else {
                  throw new Error('Gagal mempublish');
              }
          } catch (error) {
              status.textContent = '❌ Terjadi kesalahan koneksi.';
              status.className = 'text-sm mt-2 text-red-400 block text-center';
          } finally {
              btn.textContent = 'Publish Artikel';
              btn.disabled = false;
          }
      });
  </script>
</body>
</html>
