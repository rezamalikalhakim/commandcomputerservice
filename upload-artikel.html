<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Artikel - Command Computer Service</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
      body { background-color: #0a0a1a; color: #e5e7eb; font-family: 'Plus Jakarta Sans', sans-serif; }
      .gradient-text { background: linear-gradient(135deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .input-field { width: 100%; padding: 12px; background: #12122a; border: 1px solid #1f2937; border-radius: 8px; color: white; margin-top: 8px; }
      .input-field:focus { outline: none; border-color: #00d2ff; }
      
      /* Placeholder utility for contenteditable */
      [contenteditable]:empty:before {
          content: attr(placeholder);
          color: #6b7280;
          pointer-events: none;
      }
  </style>
</head>
<body class="h-full">

  <header class="sticky top-0 z-30 bg-[#0a0a1a]/90 backdrop-blur-md border-b border-gray-800/50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
     <div class="flex items-center gap-2">
      <button onclick="toggleMenu()" class="p-2 rounded-lg hover:bg-gray-800 transition-colors"><i data-lucide="menu" style="width:22px;height:22px;"></i></button>
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white text-sm"><img src="img/Logo.png" width="100%" height="100%" alt="Logo"></div>
      <div>
       <a href="index.html"><h1 class="text-lg font-bold gradient-text">Command Computer Service</h1></a>
       <p class="text-[10px] text-gray-500 mono">by Reza Malik Al Hakim</p>
      </div>
     </div>
     
     <div class="hidden md:flex items-center gap-6 text-sm">
        <a href="index.html" class="text-white">Home</a>
        <a href="artikel.html" class="text-gray-400 hover:text-white transition-colors">Artikel</a>
        <a href="service.html" class="text-gray-400 hover:text-white transition-colors">Service</a>
        <a href="kontak.html" class="text-gray-400 hover:text-white transition-colors">Kontak</a>
     </div>
     <a href="kontak.html" class="hidden sm:block px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-black text-sm font-semibold rounded-lg transition-colors">Daftar Service</a>
    </div>
  </header>

  <section class="max-w-3xl mx-auto px-4 py-12">
    <div class="bg-[#12122a] p-8 rounded-xl border border-gray-800/50">
        <div class="flex justify-between items-center mb-6">
            <h2 id="formTitle" class="text-2xl font-bold text-white">Upload Artikel Baru</h2>
            <button type="button" id="btnCancelEdit" onclick="cancelEdit()" class="hidden text-sm text-red-400 hover:text-red-300 underline">Batal Edit</button>
        </div>
        
        <form id="uploadForm" class="space-y-6">
            <div>
                <label class="text-sm text-gray-400">Judul Artikel</label>
                <input type="text" id="postTitle" class="input-field" placeholder="Contoh: Cara Memperbaiki RAM Error..." required>
            </div>

            <div>
                <label class="text-sm text-gray-400">Kategori</label>
                <select id="postCategory" class="input-field">
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Jaringan">Jaringan</option>
                </select>
            </div>

            <div>
                <label class="text-sm text-gray-400">Gambar Utama Banner (Biarkan kosong jika tidak ingin mengubah foto saat Edit)</label>
                <input type="file" id="postImage" accept="image/*" multiple class="input-field file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-cyan-500 file:text-black hover:file:bg-cyan-400">
            </div>

            <div>
                <label class="text-sm text-gray-400">Isi Artikel</label>
                <div class="mt-2 border border-gray-800 rounded-lg overflow-hidden bg-[#12122a]">
                    <div class="flex flex-wrap items-center gap-1 p-2 bg-[#1a1a35] border-b border-gray-800 text-gray-300">
                        <button type="button" onclick="formatDoc('bold')" class="p-1.5 rounded hover:bg-gray-800 hover:text-white transition-colors" title="Tebal (Bold)"><i data-lucide="bold" class="w-4 h-4"></i></button>
                        <button type="button" onclick="formatDoc('italic')" class="p-1.5 rounded hover:bg-gray-800 hover:text-white transition-colors" title="Miring (Italic)"><i data-lucide="italic" class="w-4 h-4"></i></button>
                        <button type="button" onclick="formatDoc('underline')" class="p-1.5 rounded hover:bg-gray-800 hover:text-white transition-colors" title="Garis Bawah (Underline)"><i data-lucide="underline" class="w-4 h-4"></i></button>
                        <div class="w-[1px] h-4 bg-gray-700 mx-1"></div>
                        <button type="button" onclick="formatDoc('justifyLeft')" class="p-1.5 rounded hover:bg-gray-800 hover:text-white transition-colors" title="Rata Kiri"><i data-lucide="align-left" class="w-4 h-4"></i></button>
                        <button type="button" onclick="formatDoc('justifyCenter')" class="p-1.5 rounded hover:bg-gray-800 hover:text-white transition-colors" title="Rata Tengah"><i data-lucide="align-center" class="w-4 h-4"></i></button>
                        <button type="button" onclick="formatDoc('justifyRight')" class="p-1.5 rounded hover:bg-gray-800 hover:text-white transition-colors" title="Rata Kanan"><i data-lucide="align-right" class="w-4 h-4"></i></button>
                        <div class="w-[1px] h-4 bg-gray-700 mx-1"></div>
                        <button type="button" onclick="triggerInlineImage()" class="p-1.5 rounded hover:bg-gray-800 hover:text-white transition-colors" title="Sisipkan Gambar di Artikel"><i data-lucide="image" class="w-4 h-4"></i></button>
                        <input type="file" id="inlineImageInput" accept="image/*" class="hidden" onchange="insertInlineImage(this)">
                    </div>
                    <div id="postContent" contenteditable="true" class="p-4 min-h-[250px] max-h-[500px] overflow-y-auto focus:outline-none text-white max-w-none" placeholder="Tulis konten artikel Anda di sini..."></div>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-lg hover:opacity-90 transition-opacity">
                Publish Artikel
            </button>
            <p id="uploadStatus" class="text-sm mt-2 hidden text-center"></p>
        </form>
    </div>
  </section>

  <section class="max-w-5xl mx-auto px-4 py-8 mb-16">
    <div class="bg-[#12122a] p-8 rounded-xl border border-gray-800/50">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
                <h2 class="text-xl font-bold text-white">Monitoring Riwayat Artikel</h2>
                <p class="text-xs text-gray-400 mt-1">Pantau performa statistik kunjungan, edit, dan manajemen penghapusan.</p>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" id="btnResetNotif" onclick="resetNotification()" class="px-3 py-2 border border-gray-700 hover:bg-gray-800 text-gray-300 text-xs font-semibold rounded-lg transition-colors flex items-center gap-1">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Reset Notif
                </button>
                <button type="button" id="btnBulkDelete" onclick="deleteSelectedArticles()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg transition-colors flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Terpilih (<span id="selectedCount">0</span>)
                </button>
            </div>
        </div>

        <p id="tableStatus" class="text-sm mb-4 hidden text-center p-2 rounded"></p>

        <div class="overflow-x-auto rounded-lg border border-gray-800">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-[#1a1a35] border-b border-gray-800 text-gray-400 text-xs font-semibold uppercase">
                        <th class="py-3 px-4 w-12 text-center">
                            <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)" class="rounded bg-[#12122a] border-gray-700 text-cyan-500 focus:ring-cyan-500 w-4 h-4 cursor-pointer">
                        </th>
                        <th class="py-3 px-4">Judul Artikel</th>
                        <th class="py-3 px-4 w-28">Kategori</th>
                        <th class="py-3 px-4 w-44">Waktu Upload</th>
                        <th class="py-3 px-4 w-32 text-center">Viewer</th>
                        <th class="py-3 px-4 w-24 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="articleTableBody" class="divide-y divide-gray-800 text-sm">
                    <tr>
                        <td colspan="6" class="py-8 text-center text-gray-500">Memuat data artikel...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
  </section>

  <script>
      const firebaseUrl = 'https://command-computer-service-blog-default-rtdb.asia-southeast1.firebasedatabase.app/artikel';
      
      let currentEditId = null; 
      let articlesData = {}; 

      lucide.createIcons();
      function toggleMenu() {} 

      function formatDoc(cmd, value = null) {
          document.execCommand(cmd, false, value);
          document.getElementById('postContent').focus();
      }

      function triggerInlineImage() {
          document.getElementById('inlineImageInput').click();
      }

      function insertInlineImage(input) {
          const file = input.files[0];
          if (file) {
              const reader = new FileReader();
              reader.onload = function(e) {
                  document.getElementById('postContent').focus();
                  const imgHtml = `<img src="${e.target.result}" alt="Inline Image" class="max-w-full my-3 rounded-lg inline-block" style="display:block; margin: 12px auto; max-height:350px;">`;
                  document.execCommand('insertHTML', false, imgHtml);
              };
              reader.readAsDataURL(file);
              input.value = ''; 
          }
      }

      document.addEventListener('DOMContentLoaded', fetchArticles);

      async function fetchArticles() {
          const tbody = document.getElementById('articleTableBody');
          const selectAllBox = document.getElementById('selectAllCheckbox');
          selectAllBox.checked = false;

          try {
              const response = await fetch(`${firebaseUrl}.json`);
              if(!response.ok) throw new Error('Gagal mengambil data database');
              const data = await response.json();
              
              articlesData = data || {}; 
              tbody.innerHTML = '';

              if (!data || Object.keys(data).length === 0) {
                  tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-gray-500">Belum ada artikel yang diposting.</td></tr>';
                  updateBulkDeleteState();
                  return;
              }

              const sortedArticles = Object.entries(data).sort((a, b) => new Date(b[1].waktu) - new Date(a[1].waktu));

              sortedArticles.forEach(([id, art]) => {
                  const viewerCount = art.views || art.clicks || 0;
                  const uploadTime = new Date(art.waktu).toLocaleString('id-ID', {
                      dateStyle: 'medium',
                      timeStyle: 'short'
                  });

                  const row = document.createElement('tr');
                  row.className = 'hover:bg-[#161635] transition-colors';
                  row.innerHTML = `
                      <td class="py-3.5 px-4 text-center">
                          <input type="checkbox" value="${id}" onclick="updateBulkDeleteState()" class="article-checkbox rounded bg-[#12122a] border-gray-700 text-cyan-500 focus:ring-cyan-500 w-4 h-4 cursor-pointer">
                      </td>
                      <td class="py-3.5 px-4 font-semibold text-white max-w-xs truncate" title="${art.title}">${art.title}</td>
                      <td class="py-3.5 px-4"><span class="px-2 py-0.5 text-xs rounded-full bg-gray-800 text-gray-300 border border-gray-700">${art.category}</span></td>
                      <td class="py-3.5 px-4 text-gray-400 text-xs">${uploadTime}</td>
                      <td class="py-3.5 px-4 text-center text-cyan-400 font-bold">${viewerCount}</td>
                      <td class="py-3.5 px-4 text-center flex items-center justify-center gap-1">
                          <button type="button" onclick="prepareEdit('${id}')" class="p-1.5 hover:bg-yellow-950/50 hover:text-yellow-400 rounded transition-colors text-gray-500" title="Edit Artikel">
                              <i data-lucide="edit" class="w-4 h-4 mx-auto"></i>
                          </button>
                          <button type="button" onclick="deleteSingleArticle('${id}')" class="p-1.5 hover:bg-red-950/50 hover:text-red-400 rounded transition-colors text-gray-500" title="Hapus Artikel">
                              <i data-lucide="trash" class="w-4 h-4 mx-auto"></i>
                          </button>
                      </td>
                  `;
                  tbody.appendChild(row);
              });

              lucide.createIcons();
              updateBulkDeleteState();

          } catch (error) {
              tbody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-red-400">❌ Gagal memuat riwayat artikel. Periksa koneksi internet Anda.</td></tr>';
          }
      }

      function prepareEdit(id) {
          const article = articlesData[id];
          if (!article) return;

          currentEditId = id;
          document.getElementById('postTitle').value = article.title;
          document.getElementById('postCategory').value = article.category;
          document.getElementById('postContent').innerHTML = article.content || '';
          
          document.getElementById('formTitle').textContent = 'Edit Artikel';
          document.getElementById('btnSubmit').textContent = 'Update Artikel';
          document.getElementById('btnSubmit').classList.replace('from-cyan-500', 'from-yellow-500');
          document.getElementById('btnSubmit').classList.replace('to-blue-600', 'to-orange-600');
          document.getElementById('btnCancelEdit').classList.remove('hidden');

          window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function cancelEdit() {
          currentEditId = null;
          document.getElementById('uploadForm').reset();
          document.getElementById('postContent').innerHTML = '';
          
          document.getElementById('formTitle').textContent = 'Upload Artikel Baru';
          document.getElementById('btnSubmit').textContent = 'Publish Artikel';
          document.getElementById('btnSubmit').classList.replace('from-yellow-500', 'from-cyan-500');
          document.getElementById('btnSubmit').classList.replace('to-orange-600', 'to-blue-600');
          document.getElementById('btnCancelEdit').classList.add('hidden');
      }

      function toggleSelectAll(master) {
          const checkboxes = document.querySelectorAll('.article-checkbox');
          checkboxes.forEach(cb => cb.checked = master.checked);
          updateBulkDeleteState();
      }

      function updateBulkDeleteState() {
          const checkboxes = document.querySelectorAll('.article-checkbox');
          const checkedBoxes = document.querySelectorAll('.article-checkbox:checked');
          const bulkBtn = document.getElementById('btnBulkDelete');
          const countSpan = document.getElementById('selectedCount');
          const selectAllBox = document.getElementById('selectAllCheckbox');

          countSpan.textContent = checkedBoxes.length;
          bulkBtn.disabled = checkedBoxes.length === 0;

          if(checkboxes.length > 0 && checkedBoxes.length === checkboxes.length) {
              selectAllBox.checked = true;
          } else {
              selectAllBox.checked = false;
          }
      }

      function resetNotification() {
          const uploadStatus = document.getElementById('uploadStatus');
          const tableStatus = document.getElementById('tableStatus');
          uploadStatus.className = 'text-sm mt-2 hidden text-center';
          uploadStatus.textContent = '';
          tableStatus.className = 'text-sm mb-4 hidden text-center p-2 rounded';
          tableStatus.textContent = '';
      }

      async function deleteSingleArticle(id) {
          if(!confirm('Apakah Anda yakin ingin menghapus artikel ini?')) return;
          
          const tableStatus = document.getElementById('tableStatus');
          const singleDeleteUrl = `${firebaseUrl}/${id}.json`;

          try {
              const response = await fetch(singleDeleteUrl, { method: 'DELETE' });
              if(response.ok) {
                  tableStatus.textContent = '✅ Artikel berhasil dihapus!';
                  tableStatus.className = 'text-sm mb-4 block text-center p-2 rounded bg-green-950/40 text-green-400 border border-green-900';
                  fetchArticles();
              } else {
                  throw new Error();
              }
          } catch (error) {
              tableStatus.textContent = '❌ Gagal menghapus artikel.';
              tableStatus.className = 'text-sm mb-4 block text-center p-2 rounded bg-red-950/40 text-red-400 border border-red-900';
          }
      }

      async function deleteSelectedArticles() {
          const checkedBoxes = document.querySelectorAll('.article-checkbox:checked');
          if(checkedBoxes.length === 0) return;
          if(!confirm(`Apakah Anda yakin ingin menghapus ${checkedBoxes.length} artikel terpilih?`)) return;

          const tableStatus = document.getElementById('tableStatus');
          tableStatus.textContent = 'Sedang menghapus data terpilih...';
          tableStatus.className = 'text-sm mb-4 block text-center p-2 rounded bg-yellow-950/40 text-yellow-400 border border-yellow-900';

          const deletePromises = Array.from(checkedBoxes).map(cb => {
              const id = cb.value;
              return fetch(`${firebaseUrl}/${id}.json`, { method: 'DELETE' });
          });

          try {
              await Promise.all(deletePromises);
              tableStatus.textContent = '✅ Semua artikel terpilih berhasil dihapus!';
              tableStatus.className = 'text-sm mb-4 block text-center p-2 rounded bg-green-950/40 text-green-400 border border-green-900';
              fetchArticles();
          } catch (error) {
              tableStatus.textContent = '❌ Terjadi kesalahan saat menghapus data.';
              tableStatus.className = 'text-sm mb-4 block text-center p-2 rounded bg-red-950/40 text-red-400 border border-red-900';
              fetchArticles();
          }
      }

      document.getElementById('uploadForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const btn = document.getElementById('btnSubmit');
          const status = document.getElementById('uploadStatus');
          
          btn.textContent = currentEditId ? 'Memperbarui...' : 'Mempublish...';
          btn.disabled = true;
          
          const title = document.getElementById('postTitle').value;
          const category = document.getElementById('postCategory').value;
          const content = document.getElementById('postContent').innerHTML;
          const imageFiles = document.getElementById('postImage').files;

          const toBase64 = file => new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.readAsDataURL(file);
              reader.onload = () => resolve(reader.result);
              reader.onerror = error => reject(error);
          });

          let imagesBase64 = [];
          if (imageFiles.length > 0) {
              for(let i = 0; i < imageFiles.length; i++) {
                  let b64 = await toBase64(imageFiles[i]);
                  imagesBase64.push(b64);
              }
          }

          const dataArtikel = {
              title: title,
              category: category,
              content: content,
              waktu: new Date().toISOString() 
          };

          let targetUrl = `${firebaseUrl}.json`;
          let httpMethod = 'POST'; 

          if (currentEditId) {
              targetUrl = `${firebaseUrl}/${currentEditId}.json`;
              httpMethod = 'PATCH';
              if (imagesBase64.length > 0) {
                  dataArtikel.images = imagesBase64;
              }
          } else {
              dataArtikel.images = imagesBase64;
              dataArtikel.views = 0; 
          }

          try {
              const response = await fetch(targetUrl, {
                  method: httpMethod,
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(dataArtikel)
              });

              if(response.ok) {
                  status.textContent = currentEditId ? '✅ Artikel berhasil diperbarui!' : '✅ Artikel berhasil dipublish!';
                  status.className = 'text-sm mt-2 text-green-400 block text-center';
                  cancelEdit(); 
                  fetchArticles();
              } else {
                  throw new Error('Gagal memproses data');
              }
          } catch (error) {
              status.textContent = '❌ Terjadi kesalahan koneksi database.';
              status.className = 'text-sm mt-2 text-red-400 block text-center';
          } finally {
              if(btn.disabled) {
                 btn.textContent = currentEditId ? 'Update Artikel' : 'Publish Artikel';
                 btn.disabled = false;
              }
          }
      });
  </script>
</body>
</html>
